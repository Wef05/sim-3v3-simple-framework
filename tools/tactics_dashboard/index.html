<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>场边 · 战术看板</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b121b;color:#e5edf7}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:28px;max-width:1600px;margin-inline:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;margin:8px 0}small,.muted{color:#97a9be}select,button{background:#182637;color:#e5edf7;border:1px solid #35465c;border-radius:8px;padding:9px}#status{color:#f5c56b}.layout{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(290px,1fr);gap:20px;margin-top:22px}.panel,.card{background:#121e2b;border:1px solid #26374b;border-radius:14px;padding:18px}canvas{width:100%;display:block}#summary{display:flex;gap:24px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid #26374b}#cards{display:grid;gap:12px}.card h3{margin:0 0 12px}.card p{margin:7px 0;color:#b3c1d2;font-size:14px}.role{float:right;color:#65ddbd;font-size:14px}details{margin-top:20px}pre{max-height:350px;overflow:auto;font-size:12px;white-space:pre-wrap}.legend{font-size:13px;color:#9caec3;line-height:1.8}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 6px 0 16px}#empty{padding:80px 15px;text-align:center;color:#9caec3}footer{margin-top:20px;font-size:12px;color:#71869e}@media(max-width:900px){body{padding:16px}.layout{grid-template-columns:1fr}header{flex-wrap:wrap}}
</style>
<header><div><small>SOCCER / LIVE TACTICS</small><h1>场边 · 战术看板</h1></div><div><span id="status">等待 Agent 数据</span>　<select id="team" aria-label="观测队伍"><option>暂无队伍</option></select> <button id="pause">暂停画面</button></div></header>
<div class="layout"><section class="panel"><div id="summary">尚未收到场内快照</div><div id="empty">启动比赛 Agent 并配置发送地址后，这里将显示实时场内信息。<br><br>看板只显示 Agent 实际读到的观测与决策。</div><canvas id="pitch" width="1100" height="740" hidden></canvas><div class="legend"><span class="dot" style="background:#62dfba"></span>我方 <span class="dot" style="background:#699fff"></span>对手 <span class="dot" style="background:#ffcf66"></span>球　 ◇ 目的地 / 虚线为目标方向（非规划路径）<br>坐标沿用 Agent 场地坐标，单位米；+X 向右，+Y 向上。</div></section><aside id="cards" aria-label="球员角色"><div class="card muted">等待角色分配</div></aside></div>
<details class="panel"><summary>完整 Agent 快照</summary><pre id="raw">暂无数据</pre></details><footer>超过 2 秒未更新将标记为数据陈旧；暂停画面不会暂停比赛。</footer>
<script>
const $=id=>document.getElementById(id), c=$('pitch'),g=c.getContext('2d');let paused=false, latest={};
const roleNames={attack:'进攻手',guard:'守门 / 防守',freeman:'自由人',support:'支援',kickoff:'开球',ready:'准备',stay:'等待',stopped:'停止',penalized:'被罚下',fallen:'倒地',switching_mode:'切换模式',no_pose:'位置未知'};
const phases={normal:'正常比赛',our_kickoff:'我方开球',opp_kickoff:'对方开球',our_set_play:'我方定位球',opp_set_play:'对方定位球',ready:'准备',stopped:'停止'};
function pointText(p){return p?`(${Number(p[0]).toFixed(2)}, ${Number(p[1]).toFixed(2)}) m`:'无'}
function line(parent,txt){let p=document.createElement('p');p.textContent=txt;parent.append(p)}
function draw(d){const w=d.context,f=w.field,s=Math.min(980/(f.length+2),640/(f.width+2));const xy=(x,y)=>[550+x*s,370-y*s];g.clearRect(0,0,1100,740);g.fillStyle='#112c2b';g.fillRect(0,0,1100,740);g.strokeStyle='#4f7972';g.lineWidth=2;
function path(points){g.beginPath();points.forEach((p,i)=>g[i?'lineTo':'moveTo'](...xy(...p)));g.stroke()}
function rect(x,y,a,b){g.strokeRect(...xy(x,y),a*s,-b*s)}
rect(-f.length/2,-f.width/2,f.length,f.width);path([[0,-f.width/2],[0,f.width/2]]);g.beginPath();g.arc(550,370,f.circle_radius*s,0,Math.PI*2);g.stroke();for(let sign of [-1,1]){let x=sign*f.length/2;rect(x,-f.goal_width/2,sign*.5,f.goal_width);rect(x,-f.penalty_area_width/2,-sign*f.penalty_area_length,f.penalty_area_width);rect(x,-f.goal_area_width/2,-sign*f.goal_area_length,f.goal_area_width)}
g.font='16px system-ui';g.fillStyle='#9ab7b2';g.fillText('−X',30,720);g.fillText('+X →',1000,720);
for(const p of d.players){const pose=w.teammates[p.id]?.pose;if(!pose||!p.target)continue;g.strokeStyle='#65ddbd';g.setLineDash([7,7]);path([[pose.x,pose.y],p.target]);g.setLineDash([]);let [x,y]=xy(...p.target);g.beginPath();g.moveTo(x,y-8);g.lineTo(x+8,y);g.lineTo(x,y+8);g.lineTo(x-8,y);g.closePath();g.stroke();g.fillStyle='#c3f6e6';g.fillText(`${p.id} 目标`,x+12,y-10)}
function robot(r,color,tag){if(!r.pose)return;let p=r.pose,[x,y]=xy(p.x,p.y);g.fillStyle=color;g.beginPath();g.arc(x,y,13,0,Math.PI*2);g.fill();g.strokeStyle=color;g.lineWidth=3;path([[p.x,p.y],[p.x+.45*Math.cos(p.theta),p.y+.45*Math.sin(p.theta)]]);g.lineWidth=2;g.fillStyle='#fff';g.font='bold 16px system-ui';g.fillText(tag,x-5,y-22)}
Object.values(w.opponents).forEach(r=>robot(r,'#699fff',String(r.player_id)));Object.values(w.teammates).forEach(r=>robot(r,'#62dfba',String(r.player_id)));
if(w.ball){g.fillStyle='#ffcf66';g.beginPath();g.arc(...xy(w.ball.x,w.ball.y),9,0,Math.PI*2);g.fill()}}
function render(){let entry=latest[$('team').value];if(!entry)return;const d=entry.packet,w=d.context;$('empty').hidden=true;c.hidden=false;$('status').textContent=paused?'画面已暂停':entry.age>2?`数据陈旧 · ${entry.age.toFixed(1)} 秒未更新`:`实时 · ${entry.age.toFixed(1)} 秒前`;
const score=w.game?.teams?.map(t=>`${t.team_number} 队 ${t.score}`).join(' : ')||'比分未知';$('summary').textContent=`${phases[d.phase]||d.phase||'阶段未知'}　 |　${score}　 |　剩余 ${w.game?.secs_remaining??'—'} s　 |　球${w.ball?'可见':'未知'}　 |　帧 ${d.sequence}`;
$('cards').replaceChildren();for(const p of d.players){let card=document.createElement('article');card.className='card';let h=document.createElement('h3');h.textContent=`${p.id} 号`;let role=document.createElement('span');role.className='role';role.textContent=roleNames[p.role]||p.role;h.append(role);card.append(h);const pose=w.teammates[p.id]?.pose;line(card,`动作：${p.action}`);line(card,`位置：${pointText(pose?[pose.x,pose.y]:null)}`);line(card,`目的地：${pointText(p.target)}`);line(card,`距球：${pose&&w.ball?Math.hypot(pose.x-w.ball.x,pose.y-w.ball.y).toFixed(2)+' m':'未知'}`);line(card,`模式：${p.mode??'未知'}${p.fallen?' · 倒地':''}${p.kicking?' · 踢球中':''}${p.penalized?' · 判罚 '+p.penalty:''}`);$('cards').append(card)}$('raw').textContent=JSON.stringify(d,null,2);draw(d)}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'恢复实时':'暂停画面';if(paused)$('status').textContent='画面已暂停';else render()};$('team').onchange=()=>{if(!paused)render()};
async function poll(){try{const response=await fetch('/api/state');if(!response.ok)throw Error();latest=await response.json();const keys=Object.keys(latest),selected=$('team').value;if(keys.join(',')!==Array.from($('team').options).map(o=>o.value).join(',')){ $('team').replaceChildren(...keys.map(k=>new Option(`观测队伍 ${k}`,k)));if(keys.includes(selected))$('team').value=selected}if(!paused)render()}catch(e){$('status').textContent='看板服务连接中断'}finally{setTimeout(poll,200)}}poll();
</script></html>
